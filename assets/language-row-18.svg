<?xml version="1.0" encoding="UTF-8"?>
<!-- @mostajs — rangée déterministe des 18 langages NetClient (numéros + labels exacts).
     À superposer sur la bande basse du schéma, ou à utiliser telle quelle.
     @author Dr Hamid MADANI <drmdh@msn.com> -->
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="150" viewBox="0 0 1536 150" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .card { fill:#eef2f7; stroke:#c9d4e0; stroke-width:1.2; }
