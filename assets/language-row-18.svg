    .num { fill:#ffffff; font-size:13px; font-weight:700; text-anchor:middle; }
    .lbl { fill:#16335a; font-size:11px; font-weight:600; text-anchor:middle; }
    .sub { fill:#5a6b80; font-size:7.5px; text-anchor:middle; }
    .hole { fill:#c9d4e0; }
  </style>

  <text x="768" y="16" text-anchor="middle" fill="#16335a" font-size="15" font-weight="700">18 Languages — NetClient</text>

